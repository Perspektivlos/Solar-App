<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="100" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Energy Hexagon Ring -->
  <polygon points="256,76 396,156 396,316 256,396 116,316 116,156" 
           fill="none" stroke="#334155" stroke-width="6" stroke-dasharray="12 8" opacity="0.6"/>

  <!-- Sun Rays & Energy Core -->
  <circle cx="256" cy="236" r="82" fill="url(#sunGlow)" filter="url(#glow)" opacity="0.9"/>
  <circle cx="256" cy="236" r="64" fill="#0f172a" stroke="url(#sunGlow)" stroke-width="8"/>

  <!-- Solar Cell Grid inside Core -->
  <path d="M 226,206 L 286,206 M 220,236 L 292,236 M 226,266 L 286,266 M 256,196 L 256,276" 
        stroke="#38bdf8" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

  <!-- Power Bolt Icon in Bottom Center -->
  <path d="M 262,330 L 234,380 L 254,380 L 244,424 L 278,368 L 256,368 Z" 
        fill="#f59e0b" filter="url(#glow)"/>

  <!-- Pulse dots -->
  <circle cx="256" cy="76" r="8" fill="#10b981"/>
  <circle cx="396" cy="156" r="8" fill="#38bdf8"/>
  <circle cx="396" cy="316" r="8" fill="#f59e0b"/>
  <circle cx="256" cy="396" r="8" fill="#10b981"/>
  <circle cx="116" cy="316" r="8" fill="#38bdf8"/>
  <circle cx="116" cy="156" r="8" fill="#f59e0b"/>
</svg>
